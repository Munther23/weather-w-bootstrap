<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="style.css" rel="stylesheet">
        <title>Weather</title>
    </head>

    <body>
        <div id="container">
            <div id="top-section">
                <h1>Weather Service</h1>
                <p>We'll fetch the weather for you! Where do you want to know the weather?</p>
            <main>
                <section id="weather-search">
                    <button type="button" id="my-location" class="btn btn-primary">My location!</button>
                        <form id="search-field" class="form-inline my-2 my-lg-0">
      <input id="city-input" class="form-control mr-sm-2" type="search" placeholder="Enter city here..." aria-label="Search">
    </form>
                </section>
                <div id="search-error" class="alert alert-danger d-none" role="alert">We couldn't find the city, try again!</div>
                <div id="weather-result">
                </div>
            </main>
            </div>
            
            <div id="bottom-section">
                <h2>Latest requests</h2>
                <p>We remeber your five latest requests for you.</p>
                <ul id="weather-history"></ul>
            </div>
        </div>
    </body>
    <script src="http://code.jquery.com/jquery-1.12.0.min.js"></script>
	<script src="http://code.jquery.com/jquery-migrate-1.2.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</html>
